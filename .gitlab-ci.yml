# Autopilot CI — TasteRoute on GitLab (Life After Code, Path B)
#
# Stages mirror the DevSecOps lifecycle the Duo autopilot flow drives:
#   verify → secure → package → release → monitor
# The Duo custom flow `autopilot` (autopilot-flow.yaml) orchestrates agents
# around this pipeline: triage → code → review → fix → scan → ship.

include:
  - template: Jobs/SAST.gitlab-ci.yml

stages:
  - verify
  - secure
  - package
  - release
  - monitor

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  # SAST in MR pipelines: the Jobs/SAST.gitlab-ci.yml template only creates
  # analyzer jobs in merge_request_event pipelines when this is "true".
  # (Default is branch pipelines only.) See spec/sast-fix.md.
  AST_ENABLE_MR_PIPELINES: "true"

# ---------- verify ----------
api-tests:
  stage: verify
  image: node:22-alpine
  script:
    - cd api
    - npm ci
    - npm test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

web-build:
  stage: verify
  image: node:22-alpine
  script:
    - cd web
    - npm ci
    - npm run build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------- secure (SAST template jobs run here) ----------
# The SAST template's `sast` job defaults to stage `test`, which doesn't
# exist in our stage list. Pin it to `secure` so CI is valid.
sast:
  stage: secure

# ---------- package ----------
package-api:
  stage: package
  image: docker:28
  services:
    - docker:28-dind
  script:
    - cd api
    - docker build -t "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA" .
    - docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    - docker push "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------- release ----------
# GCP jobs (deploy-staging, deploy-production) are kept for reference but
# GCP was skipped per project decision — they are allowed to fail.
deploy-staging:
  stage: release
  image: google/cloud-sdk:alpine
  script:
    - chmod +x deploy/cloudrun/deploy.sh
    - deploy/cloudrun/deploy.sh staging
  environment:
    name: staging
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Vercel web deployments (real — uses VERCEL_TOKEN CI variable)
deploy-web-staging:
  stage: release
  image: node:22-alpine
  script:
    - npm install -g vercel
    - cd web
    - vercel --token=$VERCEL_TOKEN --yes
  environment:
    name: staging
    url: https://tasteroute.vercel.app
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy-web-production:
  stage: release
  image: node:22-alpine
  script:
    - npm install -g vercel
    - cd web
    - vercel --prod --token=$VERCEL_TOKEN --yes
  environment:
    name: production
    url: https://tasteroute.vercel.app
  # Govern gate: a human approves the production promotion.
  when: manual
  allow_failure: false
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# GitHub sync — pushes showcase code to GitHub, triggering Render auto-deploy
# for the API. Non-destructive: clean commit on top of GitHub history.
sync-to-github:
  stage: release
  image: alpine:latest
  script:
    - apk add --no-cache git rsync openssh-client
    - git config --global user.email "64580363+pintu544@users.noreply.github.com"
    - git config --global user.name "Pintu Kumar"
    - git clone https://oauth2:$GITHUB_TOKEN@github.com/pintu544/tasteroute.git /tmp/gh-sync
    - rsync -av --exclude=.git --exclude=.gitlab ./ /tmp/gh-sync/
    - cd /tmp/gh-sync
    - git add -A
    - |
      if git diff --cached --quiet; then
        echo "No changes to sync."
      else
        git commit -m "Sync from GitLab showcase ($CI_COMMIT_SHORT_SHA)"
        git push origin main
        echo "Synced to GitHub — Render will auto-deploy."
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

smoke-staging:
  stage: release
  image: curlimages/curl:latest
  script:
    - |
      if [ -z "$STAGING_URL" ]; then
        echo "STAGING_URL not set (GCP pending) — smoke test SKIPPED honestly."
        exit 0
      fi
      curl -fsS --max-time 30 "$STAGING_URL/api/health"
      curl -fsS --max-time 30 -X POST "$STAGING_URL/api/plan" \
        -H 'Content-Type: application/json' -d '{"message":"smoke test"}'
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy-production:
  stage: release
  image: google/cloud-sdk:alpine
  script:
    - chmod +x deploy/cloudrun/deploy.sh
    - deploy/cloudrun/deploy.sh production
  environment:
    name: production
  # Govern gate: a human approves the production promotion.
  # GCP skipped — allowed to fail.
  when: manual
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------- monitor ----------
verify-production:
  stage: monitor
  image: curlimages/curl:latest
  script:
    - |
      if [ -z "$PRODUCTION_URL" ]; then
        echo "PRODUCTION_URL not set (GCP pending) — verification SKIPPED honestly."
        exit 0
      fi
      curl -fsS --max-time 30 "$PRODUCTION_URL/api/health" | grep -q '"ok":true'
      echo "Production is healthy."
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
