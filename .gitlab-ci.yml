# Autopilot CI — TasteRoute on GitLab (Life After Code, Path B)
#
# Stages mirror the DevSecOps lifecycle the Duo autopilot flow drives:
#   verify → secure → package → release → monitor
# The Duo custom flow `autopilot` (autopilot-flow.yaml) orchestrates agents
# around this pipeline: triage → developer → reviewer → security → fix → release.

include:
  - template: Jobs/SAST.gitlab-ci.yml

stages:
  - verify
  - secure
  - package
  - release
  - monitor

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  # SAST in MR pipelines: the Jobs/SAST.gitlab-ci.yml template only creates
  # analyzer jobs in merge_request_event pipelines when this is "true".
  # (Default is branch pipelines only.) See spec/sast-fix.md.
  AST_ENABLE_MR_PIPELINES: "true"

# ---------- verify ----------
api-tests:
  stage: verify
  image: node:22-alpine
  script:
    - cd api
    - npm ci
    - npm test
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

web-build:
  stage: verify
  image: node:22-alpine
  script:
    - cd web
    - npm ci
    - npm run build
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------- secure (SAST template jobs run here) ----------
# The SAST template's `sast` job defaults to stage `test`, which doesn't
# exist in our stage list. Pin it to `secure` so CI is valid.
sast:
  stage: secure

# Suppress the semgrep analyzer on scheduled pipelines (the template's rules
# match any branch pipeline, including schedules). Template rules copied
# verbatim below with a schedule guard prepended; `!reference` targets resolve
# against the included template.
semgrep-sast:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $SAST_DISABLED == 'true' || $SAST_DISABLED == '1'
      when: never
    - if: $SAST_EXCLUDED_ANALYZERS =~ /semgrep/
      when: never


    - if: $AST_ENABLE_MR_PIPELINES == "true" &&
          $CI_PIPELINE_SOURCE == "merge_request_event" &&
          $GITLAB_FEATURES =~ /\bsast_advanced\b/ &&
          $SAST_EXCLUDED_ANALYZERS !~ /(^|[,[:space:]])gitlab-advanced-sast([,[:space:]]|$)/ &&
          ($GITLAB_ADVANCED_SAST_ENABLED == 'true' || $GITLAB_ADVANCED_SAST_ENABLED == '1')
      variables:
        SAST_EXCLUDED_PATHS: "$DEFAULT_SAST_EXCLUDED_PATHS, **/*.py, **/*.go, **/*.java, **/*.js, **/*.jsx, **/*.ts, **/*.tsx, **/*.cjs, **/*.mjs, **/*.cs, **/*.rb, **/*.php"
        SAST_SEMGREP_EXCLUDED_PATHS: "**/*.py, **/*.go, **/*.java, **/*.js, **/*.jsx, **/*.ts, **/*.tsx, **/*.cjs, **/*.mjs, **/*.cs, **/*.rb, **/*.php"
      exists: !reference [.semgrep-with-advanced-sast-exist-rules, exists]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" &&
          $GITLAB_FEATURES =~ /\bsast_advanced\b/ &&
          $SAST_EXCLUDED_ANALYZERS !~ /(^|[,[:space:]])gitlab-advanced-sast([,[:space:]]|$)/ &&
          ($GITLAB_ADVANCED_SAST_ENABLED == 'true' || $GITLAB_ADVANCED_SAST_ENABLED == '1')
      when: never
    - if: $AST_ENABLE_MR_PIPELINES == "true" &&
          $CI_PIPELINE_SOURCE == "merge_request_event"
      exists: !reference [.semgrep-exist-rules, exists]

    - if: $AST_ENABLE_MR_PIPELINES == "true" &&
          $CI_OPEN_MERGE_REQUESTS
      when: never

    - if: $CI_COMMIT_BRANCH &&
          $GITLAB_FEATURES =~ /\bsast_advanced\b/ &&
          $SAST_EXCLUDED_ANALYZERS !~ /(^|[,[:space:]])gitlab-advanced-sast([,[:space:]]|$)/ &&
          ($GITLAB_ADVANCED_SAST_ENABLED == 'true' || $GITLAB_ADVANCED_SAST_ENABLED == '1')
      variables:
        SAST_EXCLUDED_PATHS: "$DEFAULT_SAST_EXCLUDED_PATHS, **/*.py, **/*.go, **/*.java, **/*.js, **/*.jsx, **/*.ts, **/*.tsx, **/*.cjs, **/*.mjs, **/*.cs, **/*.rb, **/*.php"
        SAST_SEMGREP_EXCLUDED_PATHS: "**/*.py, **/*.go, **/*.java, **/*.js, **/*.jsx, **/*.ts, **/*.tsx, **/*.cjs, **/*.mjs, **/*.cs, **/*.rb, **/*.php"
      exists: !reference [.semgrep-with-advanced-sast-exist-rules, exists]
    - if: $CI_COMMIT_BRANCH &&
          $GITLAB_FEATURES =~ /\bsast_advanced\b/ &&
          $SAST_EXCLUDED_ANALYZERS !~ /(^|[,[:space:]])gitlab-advanced-sast([,[:space:]]|$)/ &&
          ($GITLAB_ADVANCED_SAST_ENABLED == 'true' || $GITLAB_ADVANCED_SAST_ENABLED == '1')
      when: never
    - if: $CI_COMMIT_BRANCH
      exists: !reference [.semgrep-exist-rules, exists]
package-api:
  stage: package
  image: docker:28
  services:
    - docker:28-dind
  script:
    - cd api
    - docker build -t "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA" .
    - docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    - docker push "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------- release ----------
# GCP jobs (deploy-staging, deploy-production) are kept for reference but
# GCP was skipped per project decision — they are allowed to fail.
deploy-staging:
  stage: release
  image: google/cloud-sdk:alpine
  script:
    - chmod +x deploy/cloudrun/deploy.sh
    - deploy/cloudrun/deploy.sh staging
  environment:
    name: staging
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Vercel web deployments (real — uses VERCEL_TOKEN CI variable)
deploy-web-staging:
  stage: release
  image: node:22-alpine
  script:
    - npm install -g vercel
    - cd web
    - vercel --token=$VERCEL_TOKEN --yes
  environment:
    name: staging
    url: https://web-8709793486jio-5691s-projects.vercel.app
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy-web-production:
  stage: release
  image: node:22-alpine
  script:
    - npm install -g vercel
    - cd web
    - vercel --prod --token=$VERCEL_TOKEN --yes
  environment:
    name: production
    url: https://web-8709793486jio-5691s-projects.vercel.app
  # Govern gate: a human approves the production promotion.
  when: manual
  allow_failure: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# GitHub sync — pushes showcase code to GitHub, triggering Render auto-deploy
# for the API. Non-destructive: clean commit on top of GitHub history.
sync-to-github:
  stage: release
  image: alpine:latest
  script:
    - apk add --no-cache git rsync openssh-client
    - git config --global user.email "64580363+pintu544@users.noreply.github.com"
    - git config --global user.name "Pintu Kumar"
    - git clone https://oauth2:$GITHUB_TOKEN@github.com/pintu544/tasteroute.git /tmp/gh-sync
    - rsync -av --exclude=.git --exclude=.gitlab ./ /tmp/gh-sync/
    - cd /tmp/gh-sync
    - git add -A
    - |
      if git diff --cached --quiet; then
        echo "No changes to sync."
      else
        git commit -m "Sync from GitLab showcase ($CI_COMMIT_SHORT_SHA)"
        git push origin main
        echo "Synced to GitHub — Render will auto-deploy."
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

smoke-staging:
  stage: release
  image: curlimages/curl:latest
  variables:
    STAGING_URL: "https://web-8709793486jio-5691s-projects.vercel.app"
    API_URL: "https://tasteroute-api.onrender.com"
  script:
    - |
      echo "Smoke-testing staging: $STAGING_URL"
      curl -fsS --max-time 30 "$API_URL/api/health" | grep -q '"ok":true'
      echo "API health OK"
      curl -fsS --max-time 30 "$STAGING_URL/" | grep -q "api-version"
      echo "Footer version span present — staging smoke PASSED."
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy-production:
  stage: release
  image: google/cloud-sdk:alpine
  script:
    - chmod +x deploy/cloudrun/deploy.sh
    - deploy/cloudrun/deploy.sh production
  environment:
    name: production
  # Govern gate: a human approves the production promotion.
  # GCP skipped — allowed to fail.
  when: manual
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------- self-heal monitor (Slice 3) ----------
# Scheduled production watchdog. Curls the production health endpoints with
# retries; on a confirmed outage it files a `self-heal` issue assigned to the
# Autopilot service account, so the 6-component Duo flow picks it up hands-off.
#
# Conservative by design:
#   - 3 attempts per endpoint, 10s apart, before declaring an outage
#   - Deduplicates: never files while an open `self-heal` issue exists
#   - Without GITLAB_API_TOKEN (masked CI variable, `api` scope) it can only
#     observe: a detected outage fails the job visibly instead of filing
#     silently. Set the variable to enable auto-filing.
self-heal-monitor:
  stage: monitor
  image: python:3.13-alpine
  variables:
    WEB_URL: "https://web-8709793486jio-5691s-projects.vercel.app"
    API_URL: "https://tasteroute-api.onrender.com"
    AUTOPILOT_SERVICE_ACCOUNT_ID: "43321450"
  script:
    - |
      cat > /tmp/self_heal_monitor.py <<'PYEOF'
      """Self-heal monitor v2 — hardened per adversarial QA (Phase 3).

      Changes vs v1:
        C1: dedupe is staleness-aware — files if the open issue doesn't freshly
            cover the current failure (different incident or stale > STALE_HOURS).
        H1: probe timeout 20s -> 45s, attempts 3 -> 4 (Render cold-start/deploy safe).
        H2: new POST /api/plan probe (expects 400 "message required"; no side effects).
        M2: triage guidance says re-probe first, close as transient if healthy.
        M3: API health validated by parsing JSON (ok is True), not substring match.
        M4: GitLab API failures print a clear error instead of a raw traceback.
      """
      import datetime
      import json
      import os
      import re
      import sys
      import time
      import urllib.error
      import urllib.request

      WEB_URL = os.environ["WEB_URL"]
      API_URL = os.environ["API_URL"]
      PROJECT_ID = os.environ["CI_PROJECT_ID"]
      API_BASE = os.environ["CI_API_V4_URL"]
      TOKEN = os.environ.get("GITLAB_API_TOKEN", "")
      SERVICE_ACCOUNT_ID = int(os.environ["AUTOPILOT_SERVICE_ACCOUNT_ID"])

      STALE_HOURS = 3
      PROBE_ATTEMPTS = 4
      PROBE_TIMEOUT = 45
      PROBE_INTERVAL = 10


      def check(name, url, validate, method="GET", data=None):
          """Probe an endpoint; validate(status, body) -> bool. True if healthy."""
          for i in range(1, PROBE_ATTEMPTS + 1):
              try:
                  req = urllib.request.Request(
                      url,
                      method=method,
                      data=json.dumps(data).encode() if data is not None else None,
                      headers={"Content-Type": "application/json"} if data is not None else {},
                  )
                  with urllib.request.urlopen(req, timeout=PROBE_TIMEOUT) as r:
                      body = r.read().decode("utf-8", "replace")
                      ok = validate(r.status, body)
                      print(f"[{name}] attempt {i}/{PROBE_ATTEMPTS}: "
                            f"status {r.status} -> {'healthy' if ok else 'UNEXPECTED'}",
                            flush=True)
                      if ok:
                          return True
              except urllib.error.HTTPError as e:
                  # HTTPError carries the status code — let the validator decide
                  # (e.g. the /api/plan probe EXPECTS a 400).
                  try:
                      body = e.read().decode("utf-8", "replace")
                  except Exception:
                      body = ""
                  ok = validate(e.code, body)
                  print(f"[{name}] attempt {i}/{PROBE_ATTEMPTS}: "
                        f"status {e.code} -> {'healthy' if ok else 'UNEXPECTED'}",
                        flush=True)
                  if ok:
                      return True
              except Exception as e:
                  print(f"[{name}] attempt {i}/{PROBE_ATTEMPTS} failed: {e}", flush=True)
              if i < PROBE_ATTEMPTS:
                  time.sleep(PROBE_INTERVAL)
          return False


      def api_health_ok(status, body):
          if status != 200:
              return False
          try:
              return json.loads(body).get("ok") is True
          except Exception:
              return False


      def web_ok(status, body):
          return status == 200 and "<title>TasteRoute" in body


      def plan_ok(status, body):
          # POST /api/plan with {} -> 400 "message required" proves the route and
          # handler are live. No side effects: request validation runs before any
          # DB or LLM work.
          return status == 400


      def gitlab_api(method, path, payload=None):
          try:
              req = urllib.request.Request(
                  API_BASE + path,
                  method=method,
                  data=json.dumps(payload).encode() if payload is not None else None,
                  headers={"PRIVATE-TOKEN": TOKEN, "Content-Type": "application/json"},
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)
          except Exception as e:
              print(f"ERROR: GitLab API {method} {path} failed: {e}", flush=True)
              print("Outage detected but the issue could not be filed/checked. "
                    "Verify GITLAB_API_TOKEN is valid and the token owner can access "
                    "this project.", flush=True)
              sys.exit(1)


      def issue_coverage(issue):
          """Return (set of failed checks the issue covers, created_at as aware dt)."""
          body = issue.get("description") or ""
          m = re.search(r"\*\*Failed checks:\*\* (.+)", body)
          covered = set(x.strip() for x in m.group(1).split(",")) if m else set()
          created = datetime.datetime.fromisoformat(
              issue["created_at"].replace("Z", "+00:00"))
          return covered, created


      def should_file(failed, open_issues, now):
          """Dedupe decision.

          Skip filing only if an open issue FRESHLY covers every currently failing
          check. File otherwise (different incident, stale coverage, or unparseable
          issue body — bias is toward filing, never toward silence).
          Returns (file: bool, reason: str, related: [str]).
          """
          failed_set = set(failed)
          related = []
          for iss in open_issues:
              covered, created = issue_coverage(iss)
              age_h = (now - created).total_seconds() / 3600
              related.append(
                  f"#{iss['iid']} (covers: {', '.join(sorted(covered)) or 'unknown'}, "
                  f"age: {age_h:.1f}h)")
              if failed_set <= covered and age_h < STALE_HOURS:
                  return (False,
                          f"open issue #{iss['iid']} freshly covers "
                          f"{', '.join(failed)} (age {age_h:.1f}h < {STALE_HOURS}h)",
                          related)
          if not open_issues:
              return True, "no open self-heal issues", related
          return True, ("no open issue freshly covers "
                        f"{', '.join(failed)}"), related


      def build_body(failed, related):
          now_s = datetime.datetime.now(datetime.timezone.utc).strftime(
              "%Y-%m-%d %H:%M:%S UTC")
          sha = os.environ.get("CI_COMMIT_SHA", "n/a")[:8]
          pipe_url = os.environ.get("CI_PIPELINE_URL", "n/a")
          lines = [
              "## Automated production outage report",
              "",
              "The self-heal monitor detected a production regression. This issue was filed",
              "automatically — no human was involved.",
              "",
              f"**Failed checks:** {', '.join(failed)}",
              f"**Detected at:** {now_s}",
              f"**Monitor pipeline:** {pipe_url}",
              f"**Commit at detection time:** {sha}",
          ]
          if related:
              lines.append(
                  f"**Related open self-heal issue(s):** {'; '.join(related)}")
          lines += [
              "",
              "**Endpoints probed:**",
              f"- API health: {API_URL}/api/health "
              "(expected HTTP 200 + JSON body with `\"ok\": true`)",
              f"- API plan route: POST {API_URL}/api/plan with empty body "
              "(expected HTTP 400 — proves the route is live; no side effects)",
              f"- Web: {WEB_URL}/ (expected HTTP 200 + TasteRoute title)",
              "",
              "**Evidence:** each failing endpoint was probed "
              f"{PROBE_ATTEMPTS} times, {PROBE_INTERVAL}s apart, with a "
              f"{PROBE_TIMEOUT}s timeout. All attempts failed.",
              "",
              "**Triage guidance:** the monitor retried before filing, so this is a strong",
              "signal — but re-probe the failing endpoint(s) yourself before planning. If an",
              "endpoint is healthy now, close this issue as a transient with a brief note",
              "(do not plan a fix for a ghost). If the regression is confirmed, plan the",
              "minimal fix that restores the failing endpoint(s).",
              "",
          ]
          return "\n".join(lines)


      def main():
          results = {
              # API: server-rendered JSON — robust health signal.
              "api": check("api", API_URL + "/api/health", api_health_ok),
              # Plan route: the app's core endpoint; empty POST must 400 (no side effects).
              "plan": check("plan", API_URL + "/api/plan", plan_ok,
                            method="POST", data={}),
              # Web: the footer version marker is client-rendered (invisible to curl),
              # so verify serving instead: HTTP 200 + app title (catches Vercel/DNS/5xx
              # outages; not client-side JS failures).
              "web": check("web", WEB_URL + "/", web_ok),
          }
          failed = [k for k, v in results.items() if not v]
          if not failed:
              print("All production endpoints healthy — nothing to do.")
              return 0

          print(f"OUTAGE confirmed on: {', '.join(failed)}")
          if not TOKEN:
              print("ERROR: GITLAB_API_TOKEN is not set — cannot file the self-heal issue.")
              print("Create a personal/project access token with `api` scope and add it as a")
              print("masked CI/CD variable named GITLAB_API_TOKEN, then re-run.")
              return 1

          now = datetime.datetime.now(datetime.timezone.utc)
          open_issues = gitlab_api(
              "GET",
              f"/projects/{PROJECT_ID}/issues?labels=self-heal&state=opened&per_page=10")

          file_it, reason, related = should_file(failed, open_issues, now)
          if not file_it:
              print(f"Dedupe: {reason} — skipping file.")
              return 0
          print(f"Dedupe: {reason} — filing.")

          issue = gitlab_api("POST", f"/projects/{PROJECT_ID}/issues", {
              "title": f"\U0001F6A8 Production regression detected — "
                       f"{', '.join(failed)} (self-heal)",
              "description": build_body(failed, related),
              "labels": "self-heal",
              "assignee_ids": [SERVICE_ACCOUNT_ID],
          })
          print(f"Filed self-heal issue: {issue['web_url']}")
          return 0


      if __name__ == "__main__":
          sys.exit(main())
      PYEOF
      python3 /tmp/self_heal_monitor.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

# ---------- monitor ----------
verify-production:
  stage: monitor
  image: curlimages/curl:latest
  variables:
    PRODUCTION_URL: "https://web-8709793486jio-5691s-projects.vercel.app"
    API_URL: "https://tasteroute-api.onrender.com"
  script:
    - |
      echo "Verifying production: $PRODUCTION_URL"
      curl -fsS --max-time 30 "$API_URL/api/health" | grep -q '"ok":true'
      echo "API health OK"
      curl -fsS --max-time 30 "$API_URL/api/health" | grep -q '"version"'
      echo "API version field present"
      curl -fsS --max-time 30 "$PRODUCTION_URL/" | grep -q "api-version"
      echo "Footer version span present — production verification PASSED."
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
