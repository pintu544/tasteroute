# Autopilot CI — TasteRoute on GitLab (Life After Code, Path B)
#
# Stages mirror the DevSecOps lifecycle the Duo autopilot flow drives:
#   verify → secure → package → release → monitor
# The Duo custom flow `autopilot` (autopilot-flow.yaml) orchestrates agents
# around this pipeline: triage → developer → reviewer → security → fix → release.

include:
  - template: Jobs/SAST.gitlab-ci.yml

stages:
  - verify
  - secure
  - package
  - release
  - monitor

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  # SAST in MR pipelines: the Jobs/SAST.gitlab-ci.yml template only creates
  # analyzer jobs in merge_request_event pipelines when this is "true".
  # (Default is branch pipelines only.) See spec/sast-fix.md.
  AST_ENABLE_MR_PIPELINES: "true"

# ---------- verify ----------
api-tests:
  stage: verify
  image: node:22-alpine
  script:
    - cd api
    - npm ci
    - npm test
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

web-build:
  stage: verify
  image: node:22-alpine
  script:
    - cd web
    - npm ci
    - npm run build
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------- secure (SAST template jobs run here) ----------
# The SAST template's `sast` job defaults to stage `test`, which doesn't
# exist in our stage list. Pin it to `secure` so CI is valid.
sast:
  stage: secure

# Suppress the semgrep analyzer on scheduled pipelines (the template's rules
# match any branch pipeline, including schedules). Template rules copied
# verbatim below with a schedule guard prepended; `!reference` targets resolve
# against the included template.
semgrep-sast:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $SAST_DISABLED == 'true' || $SAST_DISABLED == '1'
      when: never
    - if: $SAST_EXCLUDED_ANALYZERS =~ /semgrep/
      when: never


    - if: $AST_ENABLE_MR_PIPELINES == "true" &&
          $CI_PIPELINE_SOURCE == "merge_request_event" &&
          $GITLAB_FEATURES =~ /\bsast_advanced\b/ &&
          $SAST_EXCLUDED_ANALYZERS !~ /(^|[,[:space:]])gitlab-advanced-sast([,[:space:]]|$)/ &&
          ($GITLAB_ADVANCED_SAST_ENABLED == 'true' || $GITLAB_ADVANCED_SAST_ENABLED == '1')
      variables:
        SAST_EXCLUDED_PATHS: "$DEFAULT_SAST_EXCLUDED_PATHS, **/*.py, **/*.go, **/*.java, **/*.js, **/*.jsx, **/*.ts, **/*.tsx, **/*.cjs, **/*.mjs, **/*.cs, **/*.rb, **/*.php"
        SAST_SEMGREP_EXCLUDED_PATHS: "**/*.py, **/*.go, **/*.java, **/*.js, **/*.jsx, **/*.ts, **/*.tsx, **/*.cjs, **/*.mjs, **/*.cs, **/*.rb, **/*.php"
      exists: !reference [.semgrep-with-advanced-sast-exist-rules, exists]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" &&
          $GITLAB_FEATURES =~ /\bsast_advanced\b/ &&
          $SAST_EXCLUDED_ANALYZERS !~ /(^|[,[:space:]])gitlab-advanced-sast([,[:space:]]|$)/ &&
          ($GITLAB_ADVANCED_SAST_ENABLED == 'true' || $GITLAB_ADVANCED_SAST_ENABLED == '1')
      when: never
    - if: $AST_ENABLE_MR_PIPELINES == "true" &&
          $CI_PIPELINE_SOURCE == "merge_request_event"
      exists: !reference [.semgrep-exist-rules, exists]

    - if: $AST_ENABLE_MR_PIPELINES == "true" &&
          $CI_OPEN_MERGE_REQUESTS
      when: never

    - if: $CI_COMMIT_BRANCH &&
          $GITLAB_FEATURES =~ /\bsast_advanced\b/ &&
          $SAST_EXCLUDED_ANALYZERS !~ /(^|[,[:space:]])gitlab-advanced-sast([,[:space:]]|$)/ &&
          ($GITLAB_ADVANCED_SAST_ENABLED == 'true' || $GITLAB_ADVANCED_SAST_ENABLED == '1')
      variables:
        SAST_EXCLUDED_PATHS: "$DEFAULT_SAST_EXCLUDED_PATHS, **/*.py, **/*.go, **/*.java, **/*.js, **/*.jsx, **/*.ts, **/*.tsx, **/*.cjs, **/*.mjs, **/*.cs, **/*.rb, **/*.php"
        SAST_SEMGREP_EXCLUDED_PATHS: "**/*.py, **/*.go, **/*.java, **/*.js, **/*.jsx, **/*.ts, **/*.tsx, **/*.cjs, **/*.mjs, **/*.cs, **/*.rb, **/*.php"
      exists: !reference [.semgrep-with-advanced-sast-exist-rules, exists]
    - if: $CI_COMMIT_BRANCH &&
          $GITLAB_FEATURES =~ /\bsast_advanced\b/ &&
          $SAST_EXCLUDED_ANALYZERS !~ /(^|[,[:space:]])gitlab-advanced-sast([,[:space:]]|$)/ &&
          ($GITLAB_ADVANCED_SAST_ENABLED == 'true' || $GITLAB_ADVANCED_SAST_ENABLED == '1')
      when: never
    - if: $CI_COMMIT_BRANCH
      exists: !reference [.semgrep-exist-rules, exists]
package-api:
  stage: package
  image: docker:28
  services:
    - docker:28-dind
  script:
    - cd api
    - docker build -t "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA" .
    - docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    - docker push "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------- release ----------
# GCP jobs (deploy-staging, deploy-production) are kept for reference but
# GCP was skipped per project decision — they are allowed to fail.
deploy-staging:
  stage: release
  image: google/cloud-sdk:alpine
  script:
    - chmod +x deploy/cloudrun/deploy.sh
    - deploy/cloudrun/deploy.sh staging
  environment:
    name: staging
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Vercel web deployments (real — uses VERCEL_TOKEN CI variable)
deploy-web-staging:
  stage: release
  image: node:22-alpine
  script:
    - npm install -g vercel
    - cd web
    - vercel --token=$VERCEL_TOKEN --yes
  environment:
    name: staging
    url: https://web-8709793486jio-5691s-projects.vercel.app
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy-web-production:
  stage: release
  image: node:22-alpine
  script:
    - npm install -g vercel
    - cd web
    - vercel --prod --token=$VERCEL_TOKEN --yes
  environment:
    name: production
    url: https://web-8709793486jio-5691s-projects.vercel.app
  # Govern gate: a human approves the production promotion.
  when: manual
  allow_failure: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# GitHub sync — pushes showcase code to GitHub, triggering Render auto-deploy
# for the API. Non-destructive: clean commit on top of GitHub history.
sync-to-github:
  stage: release
  image: alpine:latest
  script:
    - apk add --no-cache git rsync openssh-client
    - git config --global user.email "64580363+pintu544@users.noreply.github.com"
    - git config --global user.name "Pintu Kumar"
    - git clone https://oauth2:$GITHUB_TOKEN@github.com/pintu544/tasteroute.git /tmp/gh-sync
    - rsync -av --exclude=.git --exclude=.gitlab ./ /tmp/gh-sync/
    - cd /tmp/gh-sync
    - git add -A
    - |
      if git diff --cached --quiet; then
        echo "No changes to sync."
      else
        git commit -m "Sync from GitLab showcase ($CI_COMMIT_SHORT_SHA)"
        git push origin main
        echo "Synced to GitHub — Render will auto-deploy."
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

smoke-staging:
  stage: release
  image: curlimages/curl:latest
  variables:
    STAGING_URL: "https://web-8709793486jio-5691s-projects.vercel.app"
    API_URL: "https://tasteroute-api.onrender.com"
  script:
    - |
      echo "Smoke-testing staging: $STAGING_URL"
      curl -fsS --max-time 30 "$API_URL/api/health" | grep -q '"ok":true'
      echo "API health OK"
      curl -fsS --max-time 30 "$STAGING_URL/" | grep -q "api-version"
      echo "Footer version span present — staging smoke PASSED."
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy-production:
  stage: release
  image: google/cloud-sdk:alpine
  script:
    - chmod +x deploy/cloudrun/deploy.sh
    - deploy/cloudrun/deploy.sh production
  environment:
    name: production
  # Govern gate: a human approves the production promotion.
  # GCP skipped — allowed to fail.
  when: manual
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------- self-heal monitor (Slice 3) ----------
# Scheduled production watchdog. Curls the production health endpoints with
# retries; on a confirmed outage it files a `self-heal` issue assigned to the
# Autopilot service account, so the 6-component Duo flow picks it up hands-off.
#
# Conservative by design:
#   - 3 attempts per endpoint, 10s apart, before declaring an outage
#   - Deduplicates: never files while an open `self-heal` issue exists
#   - Without GITLAB_API_TOKEN (masked CI variable, `api` scope) it can only
#     observe: a detected outage fails the job visibly instead of filing
#     silently. Set the variable to enable auto-filing.
self-heal-monitor:
  stage: monitor
  image: python:3.13-alpine
  variables:
    WEB_URL: "https://web-8709793486jio-5691s-projects.vercel.app"
    API_URL: "https://tasteroute-api.onrender.com"
    AUTOPILOT_SERVICE_ACCOUNT_ID: "43321450"
  script:
    - |
      cat > /tmp/self_heal_monitor.py <<'PYEOF'
      import datetime, json, os, sys, time, urllib.request

      WEB_URL = os.environ["WEB_URL"]
      API_URL = os.environ["API_URL"]
      PROJECT_ID = os.environ["CI_PROJECT_ID"]
      API_BASE = os.environ["CI_API_V4_URL"]
      TOKEN = os.environ.get("GITLAB_API_TOKEN", "")
      SERVICE_ACCOUNT_ID = int(os.environ["AUTOPILOT_SERVICE_ACCOUNT_ID"])

      def check(name, url, marker, attempts=3):
          for i in range(1, attempts + 1):
              try:
                  with urllib.request.urlopen(url, timeout=20) as r:
                      body = r.read().decode("utf-8", "replace")
                      if r.status == 200 and marker in body:
                          print(f"[{name}] healthy (attempt {i}/{attempts})", flush=True)
                          return True
                      print(f"[{name}] attempt {i}/{attempts}: unexpected response (status {r.status})", flush=True)
              except Exception as e:
                  print(f"[{name}] attempt {i}/{attempts} failed: {e}", flush=True)
              if i < attempts:
                  time.sleep(10)
          return False

      results = {
          "api": check("api", API_URL + "/api/health", '"ok":true'),
          "web": check("web", WEB_URL + "/", "api-version"),
      }
      failed = [k for k, v in results.items() if not v]
      if not failed:
          print("All production endpoints healthy — nothing to do.")
          sys.exit(0)

      print(f"OUTAGE confirmed on: {', '.join(failed)}")
      if not TOKEN:
          print("ERROR: GITLAB_API_TOKEN is not set — cannot file the self-heal issue.")
          print("Create a personal/project access token with `api` scope and add it as a")
          print("masked CI/CD variable named GITLAB_API_TOKEN, then re-run.")
          sys.exit(1)

      def api(method, path, payload=None):
          req = urllib.request.Request(
              API_BASE + path, method=method,
              data=json.dumps(payload).encode() if payload is not None else None,
              headers={"PRIVATE-TOKEN": TOKEN, "Content-Type": "application/json"},
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              return json.load(r)

      # Deduplicate: never file while an open self-heal issue exists.
      open_issues = api("GET", f"/projects/{PROJECT_ID}/issues"
                              f"?labels=self-heal&state=opened&per_page=5")
      if open_issues:
          iids = ", ".join("#" + str(i["iid"]) for i in open_issues)
          print(f"Dedupe: {len(open_issues)} open self-heal issue(s) ({iids}) — skipping file.")
          sys.exit(0)

      now = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC")
      sha = os.environ.get("CI_COMMIT_SHA", "n/a")[:8]
      pipe_url = os.environ.get("CI_PIPELINE_URL", "n/a")
      body = (
          "## Automated production outage report\n\n"
          "The self-heal monitor detected a production regression. This issue was filed\n"
          "automatically — no human was involved.\n\n"
          f"**Failed checks:** {', '.join(failed)}\n"
          f"**Detected at:** {now}\n"
          f"**Monitor pipeline:** {pipe_url}\n"
          f"**Commit at detection time:** {sha}\n\n"
          "**Endpoints probed:**\n"
          f"- Web: {WEB_URL}/ (expected footer `api-version` marker)\n"
          f"- API: {API_URL}/api/health (expected `\"ok\":true`)\n\n"
          "**Evidence:** each failing endpoint was probed 3 times, 10s apart, with a\n"
          "20s timeout. All attempts failed.\n\n"
          "**Triage guidance:** treat this evidence as ground truth for planning — the\n"
          "monitor retries before declaring an outage and deduplicates against open\n"
          "`self-heal` issues, so this represents a confirmed live regression. Plan the\n"
          "minimal fix that restores the failing endpoint(s)."
      )
      issue = api("POST", f"/projects/{PROJECT_ID}/issues", {
          "title": f"\U0001F6A8 Production regression detected \u2014 {', '.join(failed)} (self-heal)",
          "description": body,
          "labels": "self-heal",
          "assignee_ids": [SERVICE_ACCOUNT_ID],
      })
      print(f"Filed self-heal issue: {issue['web_url']}")
      PYEOF
      python3 /tmp/self_heal_monitor.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

# ---------- monitor ----------
verify-production:
  stage: monitor
  image: curlimages/curl:latest
  variables:
    PRODUCTION_URL: "https://web-8709793486jio-5691s-projects.vercel.app"
    API_URL: "https://tasteroute-api.onrender.com"
  script:
    - |
      echo "Verifying production: $PRODUCTION_URL"
      curl -fsS --max-time 30 "$API_URL/api/health" | grep -q '"ok":true'
      echo "API health OK"
      curl -fsS --max-time 30 "$API_URL/api/health" | grep -q '"version"'
      echo "API version field present"
      curl -fsS --max-time 30 "$PRODUCTION_URL/" | grep -q "api-version"
      echo "Footer version span present — production verification PASSED."
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
