# Autopilot — hands-off issue-to-production flow (Life After Code, Path B)
#
# GitLab Duo Agent Platform custom flow definition.
# Pattern: components (agents/steps) + routers (what happens next) + prompts.
# 6 components: triage → developer → reviewer → security → fix → release
# (monitor duties merged into release). Registered as AI Catalog item 1018031.
#
# Trigger: issue assigned to the Autopilot service account
# (`ai-autopilot-gitlab-ai-hackathon`).

name: autopilot
description: >
  Hands-off loop from an assigned issue to production: triage, develop,
  review, security triage, fix, release (staging → production with govern
  gate, then post-deploy verification) — then report back on the issue.
  Human gates only where GitLab policy requires them.
trigger:
  type: issue_assignment
  assignee: ai-autopilot-gitlab-ai-hackathon

components:
  triage:
    agent: custom
    prompt_file: agents/triage.md
  developer:
    agent: custom
    prompt_file: agents/developer.md
    # Foundational Developer flow (issue -> MR) may back this component.
  reviewer:
    agent: custom
    prompt_file: agents/reviewer.md
    # Foundational Code Review flow may back this component.
  security:
    agent: custom
    prompt_file: agents/security.md
  fix:
    agent: custom
    prompt_file: agents/fix.md
    # Foundational Fix CI/CD Pipeline flow may back this component.
  release:
    agent: custom
    prompt_file: agents/release.md
    # Release covers staging deploy, smoke checks, production govern gate,
    # alias re-pointing, production verification, and the final summary —
    # monitor duties are merged here (no separate monitor component).

routers:
  - on: issue_assigned
    run: triage
    next: developer
  - on: plan_posted
    run: developer
    next: [reviewer, security]   # parallel: review + SAST triage
  - on: pipeline_failed
    run: fix
    next: reviewer               # re-review after the fix
  - on: sast_findings
    run: security
    next: fix
  - on: mr_approved_and_green
    run: release                 # merge (approval rules) -> staging -> smoke
    next: release                # production gate -> verify -> summarize
  - on: staging_unhealthy
    run: release                 # release agent rolls back, reports, stops
    stop: true
  - on: production_verified
    run: release                 # final summary, closes the issue
    stop: true

governance:
  approvals:
    - mr_merge: required          # approval rule "Human review required" — human-gated
    - production_deploy: required # manual job in .gitlab-ci.yml
  audit: every component posts to the issue/MR thread — the thread IS the log.
