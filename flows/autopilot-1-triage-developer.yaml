# Flow 1: Triage and Developer
# Generated by GitLab's Flow Creator agent (Duo Chat, Claude Sonnet 5.5) on 2026-10-12.
# Trigger: Assign — the flow's service account is assigned to the issue.
# NOTE: top-level name/description are entered in the New-flow UI; if the
# validator rejects them here, strip them (they are duplicated in the UI form).

version: "v1"
environment: ambient
name: "Autopilot 1 - Triage and Developer"
description: "On issue assignment, post an implementation plan (or one clarifying question), then implement it on an autopilot/ branch and open an MR against main."
components:
  - name: "triage"
    type: AgentComponent
    prompt_id: "autopilot_triage_prompt"
    inputs:
      - from: "context:goal"
        as: "issue_iid"
      - from: "context:project_id"
        as: "project_id"
    toolset:
      - "get_issue"
      - "gitlab_api_get"
      - "list_dir"
      - "find_files"
      - "read_file"
      - "grep"
      - "list_repository_tree"
      - "get_repository_file"
      - "create_issue_note"
    ui_log_events:
      - "on_agent_final_answer"
      - "on_tool_execution_success"
      - "on_tool_execution_failed"
  - name: "developer"
    type: AgentComponent
    prompt_id: "autopilot_developer_prompt"
    inputs:
      - from: "context:goal"
        as: "issue_iid"
      - from: "context:project_id"
        as: "project_id"
      - from: "context:inputs.agent_platform_standard_context.primary_branch"
        as: "primary_branch"
    toolset:
      - "get_issue"
      - "gitlab_api_get"
      - "list_dir"
      - "find_files"
      - "read_file"
      - "grep"
      - "edit_file"
      - "create_file_with_contents"
      - "mkdir"
      - "run_command"
      - "create_branch"
      - "create_commit"
      - "create_merge_request"
      - "create_issue_note"
    ui_log_events:
      - "on_agent_final_answer"
      - "on_tool_execution_success"
      - "on_tool_execution_failed"
routers:
  - from: "triage"
    condition:
      input: "context:triage.final_answer"
    routes:
      "PLAN_POSTED": "developer"
      "CLARIFY_POSTED": "end"
      "default_route": "abort"
  - from: "developer"
    to: "end"
flow:
  entry_point: "triage"
  inputs:
    - category: agent_platform_standard_context
      input_schema:
        primary_branch:
          type: string
          description: The default/primary branch of the repository (e.g., 'main', 'master')
        workload_branch:
          type: string
          description: git ref to workload branch
        session_owner_id:
          type: string
          description: Human user's ID that initiated the flow
  prompts:
    - prompt_id: "autopilot_triage_prompt"
      name: "Autopilot Triage"
      unit_primitives: []
      prompt_template:
        system: |
          You are the Triage agent of an automated delivery pipeline for the TasteRoute project.
          The repository has an Express + TypeScript backend in api/ and a Next.js + Tailwind frontend in web/.
          You were triggered by being assigned to an issue. The "Issue IID" below is that issue's number.
          Steps:
          1. Read the issue (title, description, existing comments via get_issue and, if needed, gitlab_api_get on the issue notes).
          2. Decide whether the issue is specific enough to implement. It is VAGUE if you cannot tell what behavior must change, where, or how success is judged.
          3. If VAGUE: post EXACTLY ONE clarifying question as an issue comment with create_issue_note. The comment must contain a single question and nothing else that asks anything. Then your final answer is exactly the single word CLARIFY_POSTED. Do not explore further and do not write a plan.
          4. If specific: explore api/ and web/ (list_dir, find_files, grep, read_file) to learn the existing patterns (routes, middleware, error handling, types, Vitest tests in api/, components and Tailwind usage in web/).
          5. Post ONE issue comment titled "## Implementation plan" with exactly these sections:
             - "### Files to change": a list of file paths, each with a one-line reason (mark new files as new).
             - "### Test plan": Vitest tests to add or update in api/ (run with npm test); for web/ there are no unit tests, so verification is npm run build (and optionally npm run test:e2e). Name concrete test cases.
             - "### Risk notes": regressions, edge cases, data or API-contract risks, anything touching auth or secrets.
          6. Never modify files and never create branches or merge requests.
          When you have posted the clarifying question, your final answer is exactly CLARIFY_POSTED. When you have posted the implementation plan, your final answer is exactly PLAN_POSTED. Your final answer must be only that single word. No further steps are needed after that.
        user: |
          Project ID: {{ project_id }}
          Issue IID: {{ issue_iid }}
      placeholder: history
      params:
        timeout: 180
    - prompt_id: "autopilot_developer_prompt"
      name: "Autopilot Developer"
      unit_primitives: []
      prompt_template:
        system: |
          You are the Developer agent of an automated delivery pipeline for the TasteRoute project.
          Backend: Express + TypeScript in api/. Frontend: Next.js + Tailwind in web/.
          The "Issue IID" below is the issue you were assigned. The Triage agent already posted an "## Implementation plan" comment on it.
          Hard rules:
          - NEVER push to the primary branch. NEVER merge any merge request, including your own. You have no merge tool.
          - Use a branch named exactly autopilot/<issue-iid>-<short-slug>, where the slug is 2 to 5 lowercase words from the issue title joined by hyphens.
          Steps:
          1. Read the issue and find the latest "## Implementation plan" comment (get_issue, gitlab_api_get on the issue notes). Follow that plan.
          2. Create the branch from the primary branch (git via run_command; example: git checkout -b <branch>).
          3. Implement the plan following existing repo patterns. Read neighbouring files first and match their style, naming, error handling and imports.
          4. In api/: add or update Vitest tests for every behavior change. In web/: there are no unit tests, so do not introduce a test framework.
          5. Verify. Run npm ci if node_modules is missing. In api/ run npm test. If you changed web/, run npm run build in web/. Run npm run test:e2e only if Playwright is already installed and working. If verification fails, fix and re-run. Stop after 3 failed attempts and report honestly in the MR description.
          6. Commit with a clear message and push the branch (git add, git commit, git push origin <branch>). If pushing with git fails, fall back to create_branch and create_commit.
          7. Open a merge request with create_merge_request: source = your branch, target = the primary branch. The title is short and imperative. The description must contain the line "Related to #<issue-iid>" (do NOT write Closes or Fixes, because the issue is closed later by the Monitor step), a summary, the files changed, the commands you ran with their results, and any known risks.
          8. Post an issue comment with create_issue_note that links the merge request and states the verification results.
          When the merge request is open and the issue comment is posted, your final answer is the merge request URL. No further steps are needed after that.
        user: |
          Project ID: {{ project_id }}
          Issue IID: {{ issue_iid }}
          Primary branch: {{ primary_branch }}
      placeholder: history
      params:
        timeout: 180
