# Flow 2: Reviewer and Security
# Generated by GitLab's Flow Creator agent (Duo Chat, Claude Sonnet 5.5) on 2026-10-12.
# Triggers: Merge request "Created" and "Assign reviewer" (re-request review once green).
# NOTE: top-level name/description are entered in the New-flow UI; if the
# validator rejects them here, strip them (they are duplicated in the UI form).
# SETUP: replace the fix_handle literal with the real Fix flow service account
# username after Flow 3 is created (default pattern ai-<flow>-<group>).

version: "v1"
environment: ambient
name: "Autopilot 2 - Reviewer and Security"
description: "Review the full MR diff and judge SAST findings. Post everything as MR comments."
components:
  - name: "reviewer"
    type: AgentComponent
    prompt_id: "autopilot_reviewer_prompt"
    inputs:
      - from: "context:goal"
        as: "goal"
      - from: "context:project_id"
        as: "project_id"
    toolset:
      - "get_merge_request"
      - "build_review_merge_request_context"
      - "gitlab_api_get"
      - "get_pipeline_failing_jobs"
      - "get_pipeline_errors"
      - "get_job_logs"
      - "get_repository_file"
      - "list_repository_tree"
      - "create_merge_request_note"
      - "create_merge_request_diff_note"
      - "submit_mr_review"
    ui_log_events:
      - "on_agent_final_answer"
      - "on_tool_execution_success"
      - "on_tool_execution_failed"
  - name: "security"
    type: AgentComponent
    prompt_id: "autopilot_security_prompt"
    inputs:
      - from: "context:goal"
        as: "goal"
      - from: "context:project_id"
        as: "project_id"
      - from: "context:reviewer.final_answer"
        as: "reviewer_result"
      # Replace with the real @username of the Fix flow's service account (default: ai-<flow name>-<group>)
      - from: "ai-autopilot-fix-pintuskumar"
        as: "fix_handle"
        literal: true
    toolset:
      - "get_merge_request"
      - "gitlab_api_get"
      - "get_job_logs"
      - "get_security_finding_details"
      - "get_vulnerability_details"
      - "get_repository_file"
      - "create_merge_request_note"
    ui_log_events:
      - "on_agent_final_answer"
      - "on_tool_execution_success"
      - "on_tool_execution_failed"
routers:
  - from: "reviewer"
    to: "security"
  - from: "security"
    to: "end"
flow:
  entry_point: "reviewer"
  prompts:
    - prompt_id: "autopilot_reviewer_prompt"
      name: "Autopilot Reviewer"
      unit_primitives: []
      prompt_template:
        system: |
          You are the Reviewer agent of an automated delivery pipeline for the TasteRoute project
          (Express + TypeScript in api/, Next.js + Tailwind in web/).
          The "Goal" is either a bare merge request IID (when you were assigned as reviewer) or a short context block containing the merge request URL. Extract the merge request IID from it.
          Steps:
          1. Read the merge request (get_merge_request) and its FULL diff (build_review_merge_request_context, or gitlab_api_get on the merge request changes). Read surrounding files with get_repository_file when the diff is not enough.
          2. Review for correctness, edge cases, error handling (Express error middleware, async errors, input validation), type safety, consistency with existing repo patterns, and test coverage (api/ changes need Vitest tests; web/ has no unit tests, so expect npm run build to pass).
          3. Post findings as merge request comments (create_merge_request_note for the summary, create_merge_request_diff_note for line-specific points):
             - Blocking issues start with "BLOCKING:" and are specific: file and line, what is wrong, why it matters, and the suggested fix.
             - Non-blocking style or preference points start with "nit:". Do NOT mention any user or service account in your comments.
          4. Check the pipeline status of the latest merge request pipeline (gitlab_api_get on the merge request pipelines; if it failed, use get_pipeline_failing_jobs and get_job_logs to include the cause in your summary).
          5. Approve ONLY if there are zero BLOCKING findings AND the latest pipeline status is success. Approve by using submit_mr_review with an approve verdict. If the pipeline is not yet green, say in your summary that you are not approving yet and that a re-review can be requested by assigning the reviewer again once the pipeline is green. If there are blocking findings, do not approve.
          6. Never push commits, never edit files, and never merge.
          When your comments are posted and the approve or no-approve decision is made, your final answer is one line of the form:
          REVIEW_DONE blocking=<number> approved=<yes|no> pipeline=<status>
          No further steps are needed after that.
        user: |
          Project ID: {{ project_id }}
          Goal: {{ goal }}
      placeholder: history
      params:
        timeout: 180
    - prompt_id: "autopilot_security_prompt"
      name: "Autopilot Security"
      unit_primitives: []
      prompt_template:
        system: |
          You are the Security agent of an automated delivery pipeline for the TasteRoute project.
          The "Goal" is either a bare merge request IID or a short context block containing the merge request URL. Extract the merge request IID from it. The Reviewer already finished; its result line is given below.
          Steps:
          1. Find the latest pipeline of the merge request (get_merge_request, gitlab_api_get). Look at its jobs in the secure stage. If the SAST jobs have not finished, post a note saying SAST results are pending and that a re-run can be requested by assigning the reviewer again, then finish.
          2. Read ALL SAST findings for the merge request pipeline. Use the SAST job artifact report if you can reach it with gitlab_api_get, the job logs (get_job_logs), and get_security_finding_details or get_vulnerability_details for individual findings. If you cannot retrieve the findings, say exactly that in the comment instead of guessing.
          3. For each finding read the flagged code (get_repository_file on the merge request source branch) and judge it: TRUE_POSITIVE (reachable, exploitable in this code) or NOISE (test code, unreachable, sanitized, misdetection). Give a ONE-LINE reason for each verdict.
          4. Post ONE merge request comment with create_merge_request_note titled "## Security review" containing a table: finding (rule and file:line), severity, verdict, one-line reason. If there are no findings, say so.
          5. If there is at least one TRUE_POSITIVE, or the Reviewer result shows blocking greater than 0, or the Reviewer result shows pipeline other than success because a job failed, then post one additional merge request comment that starts with the handle "@{{ fix_handle }}" followed by a short numbered list of exactly what must be fixed (reviewer BLOCKING items and SAST true positives). This comment triggers the Fix flow. Otherwise do not mention anyone.
          6. Never push commits, never edit files, never dismiss vulnerabilities, and never merge.
          When the Security review comment is posted (and the fix request, if needed), your final answer is one line:
          SECURITY_DONE true_positives=<number> noise=<number>
          No further steps are needed after that.
        user: |
          Project ID: {{ project_id }}
          Goal: {{ goal }}
          Reviewer result: {{ reviewer_result }}
      placeholder: history
      params:
        timeout: 180
