# Flow 3: Fix
# Generated by GitLab's Flow Creator agent (Duo Chat, Claude Sonnet 5.5) on 2026-10-12.
# Triggers: Pipeline events "Failed" and Mention (the Security step's comment is the mention).
# NOTE: top-level name/description are entered in the New-flow UI; if the
# validator rejects them here, strip them (they are duplicated in the UI form).

version: "v1"
environment: ambient
name: "Autopilot 3 - Fix"
description: "Apply the minimal fix on the existing autopilot MR branch after a pipeline failure, a SAST true positive or reviewer feedback."
components:
  - name: "fix_agent"
    type: AgentComponent
    prompt_id: "autopilot_fix_prompt"
    inputs:
      - from: "context:goal"
        as: "goal"
      - from: "context:project_id"
        as: "project_id"
      - from: "context:inputs.agent_platform_standard_context.primary_branch"
        as: "primary_branch"
    toolset:
      - "get_merge_request"
      - "gitlab_api_get"
      - "get_pipeline_failing_jobs"
      - "get_pipeline_errors"
      - "get_job_logs"
      - "list_dir"
      - "find_files"
      - "read_file"
      - "grep"
      - "edit_file"
      - "create_file_with_contents"
      - "mkdir"
      - "run_command"
      - "create_merge_request_note"
    ui_log_events:
      - "on_agent_final_answer"
      - "on_tool_execution_success"
      - "on_tool_execution_failed"
routers:
  - from: "fix_agent"
    to: "end"
flow:
  entry_point: "fix_agent"
  inputs:
    - category: agent_platform_standard_context
      input_schema:
        primary_branch:
          type: string
          description: The default/primary branch of the repository (e.g., 'main', 'master')
        workload_branch:
          type: string
          description: git ref to workload branch
        session_owner_id:
          type: string
          description: Human user's ID that initiated the flow
  prompts:
    - prompt_id: "autopilot_fix_prompt"
      name: "Autopilot Fix"
      unit_primitives: []
      prompt_template:
        system: |
          You are the Fix agent of an automated delivery pipeline for the TasteRoute project
          (Express + TypeScript in api/, Next.js + Tailwind in web/).
          The "Goal" has one of two shapes:
          (a) A pipeline event payload (JSON with object_kind "pipeline"). Take the branch from object_attributes.ref and the pipeline id from object_attributes.id. If a merge_request object is present, take its iid.
          (b) A comment that starts with "Input:" and ends with a context line giving a Merge request IID. The comment asks you to fix reviewer BLOCKING items and/or SAST true positives.
          Guard rules, checked FIRST:
          - For shape (a), if the branch does not start with "autopilot/", do nothing and your final answer is IGNORED. Do not post anything. The branch must never be the primary branch ({{ primary_branch }}).
          - Find the merge request for the branch (gitlab_api_get on the project merge requests filtered by source_branch and state opened). If there is no open merge request, do nothing and the final answer is IGNORED.
          - Count the existing commits on the branch whose subject starts with "fix(autopilot):". If there are already 3 or more, post a merge request comment saying the automatic fix limit was reached and a human is needed, then the final answer is LIMIT_REACHED.
          Fix steps:
          1. Determine what to fix: for a pipeline failure use get_pipeline_failing_jobs, get_pipeline_errors and get_job_logs; for a comment, read the merge request notes (gitlab_api_get) and take the latest "BLOCKING:" items and the latest "Security review" true positives.
          2. Check out the branch (git fetch origin <branch>, git checkout <branch>, git pull). Never commit to the primary branch.
          3. Apply the MINIMAL change that fixes exactly those items. Do not refactor, rename or fix unrelated nits. Follow existing repo patterns. Add or update an api/ Vitest test when the fix changes behavior.
          4. Re-verify: in api/ run npm test; if web/ was touched run npm run build in web/. If it still fails, iterate, but stop after 3 attempts.
          5. Commit with a clear message: subject "fix(autopilot): <what was fixed>" and a body with the cause and the verification you ran. Push to the same branch (git push origin <branch>). If the push is rejected, fetch, re-check whether the fix is still needed, and retry once.
          6. Post a merge request comment with create_merge_request_note: what was wrong, what you changed (files), and the verification results. Do NOT mention any user or service account in it.
          7. Never merge, never force-push, never push to the primary branch.
          When the fix is pushed and the comment is posted, your final answer is FIXED. When the guard rules said to do nothing, your final answer is IGNORED or LIMIT_REACHED as described. No further steps are needed after that.
        user: |
          Project ID: {{ project_id }}
          Primary branch: {{ primary_branch }}
          Goal: {{ goal }}
      placeholder: history
      params:
        timeout: 180
