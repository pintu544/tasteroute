# Flow 4: Release and Monitor
# Generated by GitLab's Flow Creator agent (Duo Chat, Claude Sonnet 5.5) on 2026-10-12.
# Trigger: Pipeline events "Passed".
# NOTE: top-level name/description are entered in the New-flow UI; if the
# validator rejects them here, strip them (they are duplicated in the UI form).

version: "v1"
environment: ambient
name: "Autopilot 4 - Release and Monitor"
description: "After a green pipeline on the primary branch: report deploy readiness, wait for human approval of the production deploy, verify production health, post the final summary and close the issue."
components:
  - name: "release_check"
    type: AgentComponent
    prompt_id: "autopilot_release_prompt"
    inputs:
      - from: "context:goal"
        as: "goal"
      - from: "context:project_id"
        as: "project_id"
      - from: "context:inputs.agent_platform_standard_context.primary_branch"
        as: "primary_branch"
    toolset:
      - "gitlab_api_get"
      - "get_merge_request"
      - "get_issue"
      - "get_pipeline_failing_jobs"
      - "create_issue_note"
    ui_log_events:
      - "on_agent_final_answer"
      - "on_tool_execution_success"
      - "on_tool_execution_failed"
  - name: "deploy_gate"
    type: HumanInputComponent
    sends_response_to: "release_check"
    interaction_type: "approval"
    message_template: |
      Production deploy gate.
      The release readiness report is posted on the issue. Staging and production deploys are manual CI jobs.
      Play the production deploy job in the pipeline, wait for it to finish, then choose:
      - Approve: the production deploy was played and finished. Start the health verification.
      - Modify: not ready yet (describe why). The release check re-reads the pipeline and re-reports.
      - Reject: do not verify or close the issue.
    ui_log_events:
      - "on_user_input_prompt"
      - "on_user_response"
  - name: "gate_rejected_notice"
    type: AgentComponent
    prompt_id: "autopilot_gate_rejected_prompt"
    inputs:
      - from: "context:goal"
        as: "goal"
      - from: "context:project_id"
        as: "project_id"
    toolset:
      - "gitlab_api_get"
      - "create_issue_note"
    ui_log_events:
      - "on_user_input_prompt"
      - "on_user_response"
  - name: "monitor"
    type: AgentComponent
    prompt_id: "autopilot_monitor_prompt"
    inputs:
      - from: "context:goal"
        as: "goal"
      - from: "context:project_id"
        as: "project_id"
      - from: "https://tasteroute-api.onrender.com/api/health"
        as: "health_url"
        literal: true
    toolset:
      - "gitlab_api_get"
      - "get_merge_request"
      - "get_issue"
      - "run_command"
      - "create_issue_note"
      - "update_issue"
    ui_log_events:
      - "on_agent_final_answer"
      - "on_tool_execution_success"
      - "on_tool_execution_failed"
routers:
  - from: "release_check"
    condition:
      input: "context:release_check.final_answer"
    routes:
      "READY": "deploy_gate"
      "SKIP": "end"
      "default_route": "abort"
  - from: "deploy_gate"
    condition:
      input: "context:deploy_gate.approval"
    routes:
      "approve": "monitor"
      "modify": "release_check"
      "reject": "gate_rejected_notice"
      "default_route": "gate_rejected_notice"
  - from: "gate_rejected_notice"
    to: "end"
  - from: "monitor"
    to: "end"
flow:
  entry_point: "release_check"
  inputs:
    - category: agent_platform_standard_context
      input_schema:
        primary_branch:
          type: string
          description: The default/primary branch of the repository (e.g., 'main', 'master')
        workload_branch:
          type: string
          description: git ref to workload branch
        session_owner_id:
          type: string
          description: Human user's ID that initiated the flow
  prompts:
    - prompt_id: "autopilot_release_prompt"
      name: "Autopilot Release Check"
      unit_primitives: []
      prompt_template:
        system: |
          You are the Release agent of an automated delivery pipeline for the TasteRoute project.
          The "Goal" is a pipeline event payload (JSON). Take the ref from object_attributes.ref, the pipeline id from object_attributes.id, the commit sha from object_attributes.sha, and the project web URL from project.web_url. The pipeline link is <project web_url>/-/pipelines/<pipeline id>.
          Step 1, guards:
          - If the ref is not the primary branch ({{ primary_branch }}), your final answer is SKIP. Post nothing.
          - Find the merge request that produced the commit (gitlab_api_get on the commit's merge requests endpoint) and read its description for the line "Related to #<issue-iid>". If there is no merge request or no such line, this was not an autopilot change, so your final answer is SKIP. Post nothing.
          - If this is the first time you run in this session, read the issue comments (gitlab_api_get). If a comment already starts with "Autopilot release readiness" and mentions this merge request, or the issue is closed, your final answer is SKIP. Post nothing.
          Step 2, verify: list the jobs of the pipeline (gitlab_api_get on the pipeline jobs). Confirm that every job in the stages verify, secure and package has status success. Also list the jobs in the release stage and their status (staging and production deploys are manual jobs; do NOT play them).
          Step 3, report: post ONE issue comment (create_issue_note) on the issue that starts with the line "Autopilot release readiness | MR !<merge request iid> | pipeline <pipeline id>" and contains: the status of each of verify, secure and package, the manual deploy jobs with their current status, a pipeline link, a merge request link, and the verdict "READY FOR STAGING AND PRODUCTION DEPLOY" or "NOT READY" with the failing job names.
          If the conversation already contains human feedback from the deploy gate, you are being re-run: skip the Step 1 duplicate check, re-read the job statuses, and post a short "Autopilot release readiness update" issue comment with the new statuses.
          You never play jobs, never merge, and never push. If verify, secure and package all passed, your final answer is exactly READY. If any of them did not pass, or a guard says to stop, your final answer is exactly SKIP. The final answer must be only that single word. No further steps are needed after that.
        user: |
          Project ID: {{ project_id }}
          Primary branch: {{ primary_branch }}
          Goal: {{ goal }}
      placeholder: history
      params:
        timeout: 180
    - prompt_id: "autopilot_gate_rejected_prompt"
      name: "Autopilot Gate Rejected Notice"
      unit_primitives: []
      prompt_template:
        system: |
          You are the Release agent. A human rejected the production deploy gate.
          The "Goal" is a pipeline event payload (JSON). Find the merge request for object_attributes.sha (gitlab_api_get on the commit's merge requests), read its description for "Related to #<issue-iid>", and post ONE issue comment (create_issue_note) saying: the production verification was not run because the deploy gate was rejected, and the issue stays open for a human to decide the next step.
          When the comment is posted, your final answer is "Rejection noted." No further steps are needed after that.
        user: |
          Project ID: {{ project_id }}
          Goal: {{ goal }}
      placeholder: history
      params:
        timeout: 180
    - prompt_id: "autopilot_monitor_prompt"
      name: "Autopilot Monitor"
      unit_primitives: []
      prompt_template:
        system: |
          You are the Monitor agent of an automated delivery pipeline for the TasteRoute project. A human approved the production deploy gate after playing the manual production deploy job.
          The "Goal" is a pipeline event payload (JSON). Take the pipeline id from object_attributes.id, the commit sha from object_attributes.sha and the project web URL from project.web_url. The pipeline link is <project web_url>/-/pipelines/<pipeline id>.
          Steps:
          1. Find the merge request for the commit (gitlab_api_get on the commit's merge requests). Read its description for "Related to #<issue-iid>" and read the issue (get_issue).
          2. Re-read the pipeline jobs (gitlab_api_get). Confirm the production deploy job (a manual job in the release stage whose name contains "prod") has status success. If it has not, post an issue comment saying so, do NOT close the issue, and finish.
          3. Verify production health with run_command: use curl against the health URL below with a 30 second max time, up to 5 retries with a 15 second delay (the host may be cold-starting), and print the HTTP status code using curl's write-out option with the http_code variable. Healthy means HTTP 200 and a response body that does not report an error status. Record the status code and body.
          4. Gather the security result: read the merge request comments (gitlab_api_get) and take the verdict table from the latest "## Security review" comment, summarised as true positives, noise, and whether any true positive remains unfixed.
          5. Post ONE final summary issue comment (create_issue_note) titled "## Autopilot summary" with: what was built (2 to 4 lines), merge request link, pipeline link, security result, and the verification outcome (health URL, HTTP status, healthy or unhealthy, time).
          6. Only if production is healthy: close the issue with update_issue (state event close). If it is unhealthy, leave the issue open and say in the summary what a human should check.
          7. Never merge, never play jobs, never push.
          When the summary is posted and the issue is closed (or intentionally left open), your final answer is a one-line statement of the outcome. No further steps are needed after that.
        user: |
          Project ID: {{ project_id }}
          Health URL: {{ health_url }}
          Goal: {{ goal }}
      placeholder: history
      params:
        timeout: 180
